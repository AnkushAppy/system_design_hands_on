services:
  redis:
    image: redis:7-alpine
    container_name: redis
    # Tight cap. allkeys-lru => evict LRU keys to free memory; writes keep succeeding under pressure.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "32mb"
      - --maxmemory-policy
      - "allkeys-lru"
    mem_limit: 64m
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [app-net]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  # Per-container CPU & memory (complements redis_exporter, which is process/INFO metrics).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [app-net]

  app-1:
    build:
      context: ./app
    container_name: app-1
    environment:
      REDIS_URL: "redis://redis:6379/0"
      APP_INSTANCE: "app-1"
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  app-2:
    build:
      context: ./app
    container_name: app-2
    environment:
      REDIS_URL: "redis://redis:6379/0"
      APP_INSTANCE: "app-2"
    depends_on:
      redis:
        condition: service_healthy
    networks: [app-net]

  load-balancer:
    image: nginx:1.25-alpine
    container_name: load-balancer
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app-1
      - app-2
    networks: [app-net]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri
      - http://load-balancer:80/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      - load-balancer
    networks: [app-net]

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - redis-exporter
      - cadvisor
      - app-1
      - app-2
      - nginx-exporter
    networks: [app-net]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks: [app-net]

  locust:
    image: locustio/locust:2.31.5
    container_name: locust
    command:
      - -f
      - /mnt/locust/locustfile.py
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust:ro
    environment:
      # Target used if set; override from Locust web UI
      TARGET_HOST: "http://load-balancer:80"
    depends_on:
      - load-balancer
    networks: [app-net]

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  app-net:
    driver: bridge
